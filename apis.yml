name: OakNorth
description: 'OakNorth is a UK-based commercial bank and business-lending institution
  founded in 2015, providing debt financing to mid-market and lower-mid-market businesses
  in the UK and, through its New York team, the United States. Its products span business
  loans (from roughly GBP 1m to tens of millions), commercial real estate lending,
  commercial & industrial cash-flow financing, fund finance, and business and personal
  savings accounts. OakNorth is backed by the SoftBank Vision Fund. It publicly exposes
  no developer API, open-banking API, or developer portal; its public technical surface
  is limited to a HackerOne responsible-disclosure program and standard web/legal properties.
  This profile was enriched by the API Evangelist pipeline.'
